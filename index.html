<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drape</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <main class="stage">
        <div id="viewport" class="viewport"></div>
        <header class="brand">
          <span class="logo">Drape</span>
          <span class="tag">live fabric mockups</span>
        </header>
        <div class="stage-tools">
          <button id="wind" class="tool" aria-pressed="false" title="Toggle wind">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8" /></svg>
            <span class="label">Wind</span>
          </button>
          <label class="tool slider-tool" id="wind-strength-wrap" hidden>
            <input id="wind-strength" type="range" min="1" max="12" step="0.5" value="6" aria-label="Wind strength" />
          </label>
          <button id="pause" class="tool" aria-pressed="false" title="Pause simulation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" /></svg>
            <span class="label">Pause</span>
          </button>
          <button id="redrape" class="tool" title="Drop the garment again">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4" /></svg>
            <span class="label">Re-drape</span>
          </button>
        </div>
        <p class="hint" id="hint">Drag the fabric to pull it · drag empty space to orbit · scroll to zoom</p>
        <div class="stats" id="stats"></div>
      </main>

      <aside class="panel">
        <section>
          <h2>Garment</h2>
          <div class="segmented" id="garments" role="tablist"></div>
          <p class="fabric" id="fabric"></p>
        </section>

        <section>
          <h2>Colour <span class="value" id="color-name"></span></h2>
          <div class="swatches" id="swatches"></div>
        </section>

        <section>
          <h2>Mannequin chest <span class="value" id="body-value"></span></h2>
          <input id="body" type="range" min="80" max="128" step="1" value="96" aria-label="Mannequin chest" />
          <p class="recommend" id="recommend"></p>
        </section>

        <section>
          <h2>Size</h2>
          <div class="sizes" id="sizes"></div>
          <div class="fit" id="fit"></div>
        </section>

        <section>
          <h2>
            Size chart
            <span class="units" role="group" aria-label="Units">
              <button data-units="cm" aria-pressed="true">cm</button><button data-units="in" aria-pressed="false">in</button>
            </span>
          </h2>
          <table class="chart">
            <thead><tr><th>Size</th><th>Chest</th><th>Length</th><th>Sleeve</th></tr></thead>
            <tbody id="chart"></tbody>
          </table>
          <p class="note">Garment measurements. Chest is the full circumference, length from the high point of the shoulder.</p>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
